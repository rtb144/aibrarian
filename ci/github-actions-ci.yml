# Copy to .github/workflows/ci.yml to enable (the push token lacked the GitHub `workflow` scope).
# gh auth refresh -s workflow && mkdir -p .github/workflows && git mv ci/github-actions-ci.yml .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aibtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aibtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,media]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  flows-import:
    # Make sure the Prefect wiring imports and builds deployments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[flows]"
      - run: python -c "import aibrarian.flows as f; assert len(f.deployments('all')) == 8"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -f docker/Dockerfile -t aibrarian:ci .
      - name: Smoke test CLI
        run: docker run --rm aibrarian:ci aibrarian --help
      - name: Validate compose
        run: cp .env.example .env && docker compose config -q && docker compose --profile devtools config -q
