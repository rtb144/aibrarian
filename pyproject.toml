[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aibrarian"
version = "0.1.0"
description = "Self-hosted AI media librarian and video transcription stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "rapidfuzz>=3.9",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1", "numpy>=1.26"]
flows = ["prefect>=3.0,<4"]
media = ["mutagen>=1.47", "pypdf>=4.0"]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26"]

[project.scripts]
aibrarian = "aibrarian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aibrarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aibrarian/dashboard.py" = ["E501"]
